# /etc/nginx/sites-available/finanzen  (DOMAIN ersetzen; HTTPS ergänzt certbot)
limit_req_zone $binary_remote_addr zone=finanzen_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    client_max_body_size 20m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/auth/ {
        limit_req zone=finanzen_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/finanzen_proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/finanzen_proxy.conf;
    }
}
